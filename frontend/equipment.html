<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipment | LabTrack</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="layout"><aside class="sidebar"><div class="brand"><div class="brand-mark">CL</div><div><b>LabTrack</b><small>Equipment Management</small></div></div><nav><a href="/">Overview</a><a class="active" href="/equipment.html">Equipment</a><a href="/users.html">Users</a><a href="/issue.html">Issue equipment</a><a href="/history.html">Issue history</a></nav><div class="side-foot">Designed &amp; Developed by<br><b>Jhansi Sai Laxmi</b></div></aside><main class="main"><header><div><p class="eyebrow">INVENTORY</p><h1>Equipment</h1><p class="muted">Add, update and maintain laboratory equipment.</p></div></header><section class="panel"><h2 id="equipmentFormTitle">Add equipment</h2><form id="equipmentForm" class="form-grid"><input type="hidden" id="equipmentId"><label>Equipment name<input id="equipmentName" required placeholder="e.g. Laptop"></label><label>Category<input id="equipmentCategory" required placeholder="e.g. Computer"></label><label>Total quantity<input id="equipmentQuantity" type="number" min="0" required value="1"></label><div class="form-actions"><button class="button" type="submit">Save equipment</button><button class="button secondary" type="button" onclick="resetEquipmentForm()">Clear</button></div></form><p id="equipmentMessage" class="message"></p></section><section class="panel"><div class="panel-head"><h2>Inventory list</h2><input id="equipmentSearch" class="search" placeholder="Search equipment or category"></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Category</th><th>Total</th><th>Available</th><th>Status</th><th>Actions</th></tr></thead><tbody id="equipmentRows"></tbody></table></div></section></main></div><script src="/js/app.js"></script><script>loadEquipment();</script></body></html>
