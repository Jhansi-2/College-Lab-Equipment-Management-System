
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Issue History | LabTrack</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">CL</div>
        <div>
          <b>LabTrack</b>
          <small>Equipment Management</small>
        </div>
      </div>

      <nav>
        <a href="/">Overview</a>
        <a href="/equipment.html">Equipment</a>
        <a href="/users.html">Users</a>
        <a href="/issue.html">Issue equipment</a>
        <a class="active" href="/history.html">Issue history</a>
      </nav>

      <div class="side-foot">
        Designed &amp; Developed by<br>
        <b>Jhansi Sai Laxmi</b>
      </div>
    </aside>

    <main class="main">
      <header>
        <div>
          <p class="eyebrow">RECORDS</p>
          <h1>Issue history</h1>
          <p class="muted">Review issues and process equipment returns.</p>
        </div>
      </header>

      <section class="panel">
        <div class="panel-head">
          <h2>All transactions</h2>
          <button class="button secondary" onclick="loadHistory()">Refresh</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Equipment</th>
                <th>User</th>
                <th>Issue date</th>
                <th>Due date</th>
                <th>Return date</th>
                <th>Qty</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="historyRows"></tbody>
          </table>
        </div>

        <p id="historyMessage" class="message"></p>
      </section>
    </main>
  </div>

  <script src="/js/app.js"></script>
  <script>loadHistory();</script>
</body>
</html>
